# Render Blueprint for handlemyap (also deployable via the Render API).
databases:
  - name: handlemyap-db
    plan: free
    databaseName: handlemyap
    user: handlemyap
    region: oregon

services:
  - type: web
    name: handlemyap
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_KEY
        sync: false   # set in the Render dashboard / via API (php artisan key:generate --show)
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: handlemyap-db
          property: connectionString
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # PayPal + AI are optional — the app runs with safe fakes until you add them:
      # - key: PAYPAL_CLIENT_ID
      # - key: PAYPAL_SECRET
      # - key: ANTHROPIC_API_KEY
