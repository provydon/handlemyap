# Render blueprint for handlemyap. (The live demo is a Docker web service built
# from the Dockerfile; this file documents/reproduces that setup.)
services:
  - type: web
    name: handlemyap
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    autoDeploy: true
    # Persistent disk: the SQLite database and uploaded invoice files live here,
    # so data survives deploys and restarts. (Requires a paid plan.)
    disk:
      name: handlemyap-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Point the database and uploads at the persistent disk.
      - key: DB_DATABASE
        value: /data/database.sqlite
      - key: FILESYSTEM_LOCAL_ROOT
        value: /data/storage/private
      - key: HANDLEMYAP_GATEWAY
        value: auto
      - key: HANDLEMYAP_EXTRACTOR
        value: auto
      # Set these in the Render dashboard to light up the real integrations.
      # Without them the app runs in demo mode (offline AI stub + simulated capture).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
