# Render blueprint for handlemyap. (The live demo is a Docker web service built
# from the Dockerfile; this file documents/reproduces that setup.)
services:
  - type: web
    name: handlemyap
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: HANDLEMYAP_GATEWAY
        value: auto
      - key: HANDLEMYAP_EXTRACTOR
        value: auto
      # Set these in the Render dashboard to light up the real integrations.
      # Without them the app runs in demo mode (offline AI stub + simulated capture).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
