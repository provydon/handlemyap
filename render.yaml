# Render blueprint for handlemyap. (The live demo is a Docker web service built
# from the Dockerfile; this file documents/reproduces that setup.)
services:
  - type: web
    name: handlemyap
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    autoDeploy: true
    # Persistent disk for the SQLite database (uploaded files go to S3, below),
    # so dashboard data survives deploys and restarts. (Requires a paid plan.)
    disk:
      name: handlemyap-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # SQLite database on the persistent disk.
      - key: DB_DATABASE
        value: /data/database.sqlite
      # Uploaded invoice files live in S3 (the "handlemyap" bucket).
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_DEFAULT_REGION
        value: eu-central-1
      - key: AWS_BUCKET
        value: handlemyap
      # Secrets — set in the Render dashboard / via API, never committed.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: HANDLEMYAP_GATEWAY
        value: auto
      - key: HANDLEMYAP_EXTRACTOR
        value: auto
      # Set these in the Render dashboard to light up the real integrations.
      # Without them the app runs in demo mode (offline AI stub + simulated capture).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
