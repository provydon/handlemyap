# Render blueprint for handlemyap. (The live demo is a Docker web service built
# from the Dockerfile; this file documents/reproduces that setup.)
services:
  - type: web
    name: handlemyap
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Dashboard data lives in a remote PostgreSQL (the shared fikets DB server).
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: 46.101.248.141
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: handlemyap
      - key: DB_USERNAME
        value: handlemyap
      - key: DB_SSLMODE
        value: require
      - key: DB_PASSWORD
        sync: false
      # Uploaded invoice files live in S3 (the "handlemyap" bucket).
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_DEFAULT_REGION
        value: eu-central-1
      - key: AWS_BUCKET
        value: handlemyap
      # Secrets — set in the Render dashboard / via API, never committed.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: HANDLEMYAP_GATEWAY
        value: auto
      - key: HANDLEMYAP_EXTRACTOR
        value: auto
      # Set these in the Render dashboard to light up the real integrations.
      # Without them the app runs in demo mode (offline AI stub + simulated capture).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
